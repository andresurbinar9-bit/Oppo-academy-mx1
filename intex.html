      } else if (STATE.clientMode === 'ai') {
        const oppo = OPPO_MODELS.find(m => m.id === STATE.clientSelectedOppo) || OPPO_MODELS[0];
        const ev = evaluateClientArgument(raw, oppo, []);
        const passed = ev.benefitHits >= 2 && ev.specHits >= 2 && ev.totalScore >= 55;

        if (passed) {
          STATE.clientClosed = true;
          STATE.clientMessages.push({
            role: 'client',
            tag: 'Cliente IA Convencido ✓',
            text: `Excelente explicación. Tradujiste las especificaciones del ${oppo.name} (${oppo.battery}, ${oppo.resistance}) en beneficios claros para mi día a día. Ya confío en OPPO y decido comprarlo. (+45 XP)`
          });
          markModalityConvinced('ai');
          recordActivity(`Cliente IA convencido (${oppo.name})`, 45, {
            label: 'Practicar en Simulador de Clientes',
            action: 'open-train-sub',
            param: 'client'
          });
        } else if (STATE.clientTurn === 0) {
          STATE.clientTurn = 1;
          STATE.clientMessages.push({
            role: 'client',
            tag: 'Cliente IA (Pide beneficio + dato real)',
            text: ev.benefitHits < 2
              ? `Me mencionaste datos técnicos, pero sigo sin ver el beneficio práctico en mi vida diaria. Explícame: ¿para qué me sirve eso en mi rutina con el ${oppo.name}?`
              : `Suena bien lo que dices, pero dame datos exactos del ${oppo.name} (capacidad de batería, watts de carga, cámara o certificación) que respalden ese beneficio.`
          });
        } else {
          STATE.clientClosed = true;
          STATE.clientMessages.push({
            role: 'client',
            tag: 'Cliente IA (Requiere mayor persuasión)',
            text: `Para convencer a un cliente escéptico en esta modalidad recuerda que el beneficio pesa más que el dato suelto: une una característica real del ${oppo.name} con una frase como "para que..." o "te permite...".`
          });
        }
      } else {
        const oppo = OPPO_MODELS.find(m => m.id === STATE.clientSelectedOppo) || OPPO_MODELS[0];
        const chain = FREE_CLIENT_CHAIN[0];
        const ev = evaluateClientArgument(raw, oppo, []);
        const stepPassed = ev.benefitHits >= 2 && ev.specHits >= 2 && ev.totalScore >= 60;

        if (stepPassed && STATE.clientFreeStep < chain.followUps.length) {
          const nextFollow = chain.followUps[STATE.clientFreeStep];
          STATE.clientFreeStep += 1;
          STATE.clientMessages.push({
            role: 'client',
            tag: `Cliente Libre · Objeción ${STATE.clientFreeStep + 1}/3 (${nextFollow.rivalName})`,
            text: nextFollow.text
          });
        } else if (stepPassed && STATE.clientFreeStep >= chain.followUps.length) {
          STATE.clientClosed = true;
          STATE.clientMessages.push({
            role: 'client',
            tag: 'Cliente Libre Convencido ✓ (Nivel Muy Difícil Superado)',
            text: `¡Me convenciste por completo! Superaste todas mis dudas frente a las otras marcas combinando datos exactos del ${oppo.name} con beneficios reales para mi vida diaria. Cierro la compra contigo. (+75 XP)`
          });
          markModalityConvinced('free');
          recordActivity(`Cliente Libre Muy Difícil convencido (${oppo.name})`, 75, {
            label: 'Practicar en Simulador de Clientes',
            action: 'open-train-sub',
            param: 'client'
          });
        } else if (STATE.clientTurn < 2) {
          STATE.clientTurn += 1;
          STATE.clientMessages.push({
            role: 'client',
            tag: 'Cliente Libre · Muy Escéptico',
            text: ev.benefitHits < 2
              ? `No me basta con especificaciones sueltas: sigo dudando de cambiarme a OPPO. Dime concretamente qué beneficio real voy a ganar en mi día a día con el ${oppo.name} frente a la competencia.`
              : `Necesito que respaldes ese beneficio con cifras y certificaciones exactas del ${oppo.name} (batería mAh, carga SUPERVOOC, cámara OIS o certificación IP/SGS/TÜV).`
          });
        } else {
          STATE.clientClosed = true;
          STATE.clientMessages.push({
            role: 'client',
            tag: 'Cliente Libre (No convencido en esta ronda)',
            text: `El Cliente Libre es el nivel más exigente: requiere superar 3 objeciones seguidas uniendo características exactas del ${oppo.name} con beneficios claros para el usuario. ¡Inténtalo de nuevo!`
          });
        }
      }

      render();
      const box = document.getElementById('sim-chat-box');
      if (box) box.scrollTop = box.scrollHeight;
    }

    /* =========================================================================
       14. INTERACTIVE LUMO WIPE SLIDER & PHOTO UPLOAD BINDING
       ========================================================================= */
    function setLumoWipeManual(rawPct) {
      const clamped = Math.max(5, Math.min(95, Math.round(Number(rawPct) || 55)));
      STATE.lumoWipePct = clamped;
      STATE.lumoLooping = false;
      STATE.lumoActive = clamped >= 50;

      const clipEl = document.getElementById('lumo-on-clip');
      const divEl = document.getElementById('lumo-divider-bar');
      const rangeEl = document.getElementById('lumo-wipe-range');

      if (clipEl) {
        clipEl.classList.remove('is-looping');
        clipEl.classList.add('is-dragging');
        clipEl.style.width = clamped + '%';
      }
      if (divEl) {
        divEl.classList.remove('is-looping');
        divEl.classList.add('is-dragging');
        divEl.style.left = clamped + '%';
      }
      if (rangeEl && Number(rangeEl.value) !== clamped) {
        rangeEl.value = clamped;
      }
    }

    function bindDynamicControls() {
      const rangeEl = document.getElementById('lumo-wipe-range');
      if (rangeEl) {
        rangeEl.addEventListener('input', function () {
          setLumoWipeManual(rangeEl.value);
        });
        rangeEl.addEventListener('change', function () {
          const clipEl = document.getElementById('lumo-on-clip');
          const divEl = document.getElementById('lumo-divider-bar');
          if (clipEl) clipEl.classList.remove('is-dragging');
          if (divEl) divEl.classList.remove('is-dragging');
        });
      }

      const viewportEl = document.getElementById('lumo-compare-viewport');
      if (viewportEl) {
        let dragging = false;
        const updateFromClientX = function (clientX) {
          const rect = viewportEl.getBoundingClientRect();
          if (!rect.width) return;
          const pct = ((clientX - rect.left) / rect.width) * 100;
          setLumoWipeManual(pct);
        };

        viewportEl.addEventListener('pointerdown', function (e) {
          dragging = true;
          updateFromClientX(e.clientX);
        });
        window.addEventListener('pointermove', function (e) {
          if (!dragging) return;
          updateFromClientX(e.clientX);
        }, { passive: true });
        window.addEventListener('pointerup', function () {
          if (!dragging) return;
          dragging = false;
          const clipEl = document.getElementById('lumo-on-clip');
          const divEl = document.getElementById('lumo-divider-bar');
          if (clipEl) clipEl.classList.remove('is-dragging');
          if (divEl) divEl.classList.remove('is-dragging');
        }, { passive: true });
      }

      const photoInput = document.getElementById('profile-photo-file');
      if (photoInput) {
        photoInput.addEventListener('change', function () {
          const file = photoInput.files && photoInput.files[0];
          if (!file) return;
          if (!file.type || !file.type.startsWith('image/')) {
            STATE.profileError = 'Selecciona un archivo de imagen válido (JPG, PNG o WebP).';
            STATE.profileNotice = '';
            render();
            return;
          }
          const reader = new FileReader();
          reader.onload = function (ev) {
            const img = new Image();
            img.onload = function () {
              try {
                const maxSide = 220;
                const scale = Math.min(1, maxSide / Math.max(img.width || 1, img.height || 1));
                const w = Math.max(40, Math.round(img.width * scale));
                const h = Math.max(40, Math.round(img.height * scale));
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.84);
                const prog = getProgress();
                prog.customPhotoData = dataUrl;
                prog.avatarChoice = 'custom_photo';
                saveProgress(prog);
                STATE.profileError = '';
                STATE.profileNotice = 'Foto de perfil actualizada correctamente.';
                render();
              } catch (err) {
                STATE.profileError = 'No se pudo procesar la imagen seleccionada.';
                STATE.profileNotice = '';
                render();
              }
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });
      }
    }

    /* =========================================================================
       15. MAIN RENDER & EVENT DELEGATION
       ========================================================================= */
    function render() {
      const headerEl = document.getElementById('app-header');
      const navEl = document.getElementById('app-nav');
      const mainEl = document.getElementById('app-main');
      const modalRoot = document.getElementById('ai-modal-root');

      if (!STATE.currentUser) {
        headerEl.classList.add('hidden');
        navEl.classList.add('hidden');
        mainEl.classList.add('gateway-mode');
        mainEl.innerHTML = renderAuthView();
        modalRoot.innerHTML = '';
        return;
      }

      headerEl.classList.remove('hidden');
      navEl.classList.remove('hidden');
      mainEl.classList.remove('gateway-mode');

      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-nav') === STATE.route);
      });

      if (STATE.route === 'home') mainEl.innerHTML = renderHome();
      else if (STATE.route === 'learn') mainEl.innerHTML = renderLearn();
      else if (STATE.route === 'train') mainEl.innerHTML = renderTrain();
      else if (STATE.route === 'profile') mainEl.innerHTML = renderProfile();
      else mainEl.innerHTML = renderHome();

      modalRoot.innerHTML = renderAiModal();
      bindDynamicControls();
    }

    function navigateTo(route) {
      stopChallengeTimer();
      stopVoiceRecognition();
      STATE.route = route;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function startQuizSession(questionsList, isEval, activityLabel) {
      stopChallengeTimer();
      stopVoiceRecognition();
      STATE.route = 'train';
      STATE.trainView = 'quiz';
      STATE.quizIsEval = !!isEval;
      STATE.quizQuestions = questionsList;
      STATE.quizIndex = 0;
      STATE.quizAnswered = false;
      STATE.quizSelectedOpt = -1;
      STATE.quizHits = 0;
      STATE.quizMisses = 0;
      STATE.quizMissedList = [];

      const prog = getProgress();
      prog.lastActivity = {
        label: activityLabel,
        action: 'open-train-hub',
        param: 'hub'
      };
      saveProgress(prog);
      render();
    }

    function startChallengeSession(seconds) {
      stopChallengeTimer();
      stopVoiceRecognition();
      const sec = Number(seconds) || 60;
      const poolKey = String(sec);
      const sourcePool = CHALLENGE_POOLS[poolKey] || CHALLENGE_POOLS['60'];
      const shuffled = sourcePool.slice().sort(() => Math.random() - 0.5);

      STATE.route = 'train';
      STATE.trainView = 'challenge_run';
      STATE.challengeSec = sec;
      STATE.challengeTimeLeft = sec;
      STATE.challengeScore = 0;
      STATE.challengePool = shuffled;
      STATE.challengeIndex = 0;
      STATE.challengeFinished = false;

      if (sec === 20 || sec === 15) {
        playChallengeTick(false);
        challengeFastInterval = setInterval(function () {
          if (STATE.challengeFinished || STATE.trainView !== 'challenge_run') {
            stopChallengeTimer();
            return;
          }
          if (STATE.challengeTimeLeft <= 8) {
            playChallengeTick(true);
          }
        }, 500);
      }

      challengeInterval = setInterval(function () {
        STATE.challengeTimeLeft -= 1;

        if (STATE.challengeTimeLeft <= 0) {
          stopChallengeTimer();
          STATE.challengeTimeLeft = 0;
          STATE.challengeFinished = true;
          const prog = getProgress();
          prog.bestChallenge = prog.bestChallenge || { '60': 0, '20': 0, '15': 0 };
          const key = String(STATE.challengeSec);
          if (STATE.challengeScore > (prog.bestChallenge[key] || 0)) {
            prog.bestChallenge[key] = STATE.challengeScore;
          }
          saveProgress(prog);
          recordActivity(`Reto contrarreloj (${STATE.challengeSec}s)`, STATE.challengeScore * 15, {
            label: 'Jugar Retos Contrarreloj',
            action: 'open-train-sub',
            param: 'challenges'
          });
          render();
          return;
        }

        if (STATE.challengeSec === 20 || STATE.challengeSec === 15) {
          if (STATE.challengeTimeLeft > 8) {
            playChallengeTick(false);
          }
        }

        const badgeEl = document.getElementById('challenge-timer-badge');
        if (badgeEl) {
          badgeEl.textContent = `⏱ ${STATE.challengeTimeLeft}s`;
          badgeEl.classList.toggle('danger', STATE.challengeTimeLeft <= 10);
        }
        const cardEl = document.getElementById('challenge-active-card');
        if (cardEl && (STATE.challengeSec === 20 || STATE.challengeSec === 15)) {
          cardEl.classList.toggle('urgent-shake', STATE.challengeTimeLeft <= 8);
        }
        syncScreenPressureEffects();
      }, 1000);

      render();
      syncScreenPressureEffects();
    }

    document.addEventListener('click', function (e) {
      const target = e.target.closest('[data-action]');
      if (!target) {
        if (e.target && e.target.id === 'ai-modal-backdrop') {
          STATE.aiModalOpen = false;
          render();
        }
        return;
      }

      const action = target.getAttribute('data-action');
      const param = target.getAttribute('data-param') || '';

      if (action === 'toggle-theme') {
        STATE.theme = STATE.theme === 'dark' ? 'light' : 'dark';
        applyTheme();
        return;
      }

      if (action === 'auth-mode') {
        STATE.authMode = param;
        STATE.authError = '';
        STATE.authNotice = '';
        STATE.recoverStep = 'lookup';
        STATE.showPass1 = false;
        STATE.showPass2 = false;
        STATE.showRecPass1 = false;
        STATE.showRecPass2 = false;
        STATE.authFormDraft.pass1 = '';
        STATE.authFormDraft.pass2 = '';
        render();
        return;
      }

      if (action === 'open-recover-password') {
        STATE.authMode = 'recover';
        STATE.recoverStep = 'lookup';
        STATE.authError = '';
        STATE.authNotice = '';
        STATE.authFormDraft.pass1 = '';
        STATE.authFormDraft.pass2 = '';
        render();
        return;
      }

      if (action === 'toggle-pass-vis') {
        if (param === '1') STATE.showPass1 = !STATE.showPass1;
        else STATE.showPass2 = !STATE.showPass2;
        render();
        return;
      }

      if (action === 'toggle-rec-pass') {
        if (param === '1') STATE.showRecPass1 = !STATE.showRecPass1;
        else STATE.showRecPass2 = !STATE.showRecPass2;
        render();
        return;
      }

      if (action === 'verify-recovery-email') {
        const email = ((document.getElementById('rec-email') || {}).value || STATE.authFormDraft.email || '').trim().toLowerCase();
        STATE.authFormDraft.email = email;
        if (!email || !email.includes('@')) {
          STATE.authError = 'Ingresa un correo electrónico válido.';
          STATE.authNotice = '';
          render();
          return;
        }
        const users = loadUsersMap();
        if (!users[email]) {
          STATE.authError = 'No encontramos una cuenta registrada con ese correo en este dispositivo.';
          STATE.authNotice = '';
          render();
          return;
        }
        STATE.recoverEmail = email;
        STATE.recoverStep = 'reset';
        STATE.authError = '';
        STATE.authNotice = '';
        STATE.authFormDraft.pass1 = '';
        STATE.authFormDraft.pass2 = '';
        render();
        return;
      }

      if (action === 'save-recovered-password') {
        const p1 = ((document.getElementById('rec-pass-new') || {}).value || STATE.authFormDraft.pass1 || '').trim();
        const p2 = ((document.getElementById('rec-pass-confirm') || {}).value || STATE.authFormDraft.pass2 || '').trim();
        STATE.authFormDraft.pass1 = p1;
        STATE.authFormDraft.pass2 = p2;

        if (p1.length < 4) {
          STATE.authError = 'La nueva contraseña debe tener al menos 4 caracteres.';
          STATE.authNotice = '';
          render();
          return;
        }
        if (p1 !== p2) {
          STATE.authError = 'Las contraseñas nuevas no coinciden.';
          STATE.authNotice = '';
          render();
          return;
        }
        const users = loadUsersMap();
        if (!users[STATE.recoverEmail]) {
          STATE.authError = 'No se pudo localizar la cuenta para actualizarla.';
          render();
          return;
        }
        users[STATE.recoverEmail].password = p1;
        saveUsersMap(users);

        STATE.authMode = 'login';
        STATE.recoverStep = 'lookup';
        STATE.authError = '';
        STATE.authNotice = 'Contraseña restablecida correctamente. Ya puedes iniciar sesión.';
        STATE.authFormDraft.email = STATE.recoverEmail;
        STATE.authFormDraft.pass1 = '';
        STATE.authFormDraft.pass2 = '';
        render();
        return;
      }

      if (action === 'submit-auth') {
        const email = ((document.getElementById('auth-email') || {}).value || STATE.authFormDraft.email || '').trim().toLowerCase();
        const pass = ((document.getElementById('auth-pass') || {}).value || STATE.authFormDraft.pass1 || '').trim();
        const name = ((document.getElementById('auth-name') || {}).value || STATE.authFormDraft.name || '').trim();
        const passConfirm = ((document.getElementById('auth-pass-confirm') || {}).value || STATE.authFormDraft.pass2 || '').trim();

        STATE.authFormDraft = { name, email, pass1: pass, pass2: passConfirm };

        if (!email || !email.includes('@')) {
          STATE.authError = 'Ingresa un correo electrónico válido.';
          STATE.authNotice = '';
          render();
          return;
        }
        if (pass.length < 4) {
          STATE.authError = 'La contraseña debe tener al menos 4 caracteres.';
          STATE.authNotice = '';
          render();
          return;
        }

        const users = loadUsersMap();

        if (STATE.authMode === 'register') {
          if (!name) {
            STATE.authError = 'Ingresa tu nombre completo para registrarte.';
            STATE.authNotice = '';
            render();
            return;
          }
          if (pass !== passConfirm) {
            STATE.authError = 'Las contraseñas no coinciden. Verifica ambos campos.';
            STATE.authNotice = '';
            render();
            return;
          }
          if (users[email]) {
            STATE.authError = 'Este correo ya está registrado. Inicia sesión.';
            STATE.authNotice = '';
            render();
            return;
          }
          users[email] = { name, email, password: pass, progress: defaultProgress() };
          saveUsersMap(users);
          STATE.currentUser = { name, email, isGuest: false };
          try { localStorage.setItem(STORAGE_SESSION_KEY, JSON.stringify(STATE.currentUser)); } catch (err) {}
          STATE.authError = '';
          STATE.authNotice = '';
          STATE.authFormDraft = { name: '', email: '', pass1: '', pass2: '' };
          STATE.route = 'home';
          render();
          return;
        }

        const acct = users[email];
        if (!acct || acct.password !== pass) {
          STATE.authError = 'Correo o contraseña incorrectos.';
          STATE.authNotice = '';
          render();
          return;
        }
        STATE.currentUser = { name: acct.name, email: acct.email, isGuest: false };
        try { localStorage.setItem(STORAGE_SESSION_KEY, JSON.stringify(STATE.currentUser)); } catch (err) {}
        STATE.authError = '';
        STATE.authNotice = '';
        STATE.authFormDraft = { name: '', email: '', pass1: '', pass2: '' };
        STATE.route = 'home';
        render();
        return;
      }

      if (action === 'enter-guest') {
        guestProgressCache = defaultProgress();
        STATE.currentUser = { name: 'Asesor Invitado', email: 'invitado@oppo.mx', isGuest: true };
        STATE.authError = '';
        STATE.authNotice = '';
        STATE.route = 'home';
        render();
        return;
      }

      if (action === 'logout') {
        stopChallengeTimer();
        stopVoiceRecognition();
        STATE.currentUser = null;
        STATE.profileError = '';
        STATE.profileNotice = '';
        try { localStorage.removeItem(STORAGE_SESSION_KEY); } catch (err) {}
        render();
        return;
      }

      if (action === 'go') {
        if (param === 'learn') {
          STATE.modelDetailOpen = false;
          STATE.returnToModelId = '';
        }
        navigateTo(param);
        return;
      }

      if (action === 'continue-learning') {
        STATE.route = 'learn';
        STATE.learnTab = 'models';
        STATE.selectedModelId = param || 'findx10';
        STATE.modelDetailOpen = true;
        render();
        return;
      }

      if (action === 'learn-tab') {
        STATE.learnTab = param;
        STATE.modelDetailOpen = false;
        STATE.returnToModelId = '';
        if (param === 'certs') {
          const prog = getProgress();
          prog.exploredCerts = true;
          saveProgress(prog);
        } else if (param === 'collab') {
          const prog = getProgress();
          prog.exploredCollabs = true;
          saveProgress(prog);
        }
        render();
        return;
      }

      if (action === 'open-cert-from-model') {
        const parts = param.split('|');
        const fromModelId = parts[0] || 'findx10';
        const targetType = parts[1] || 'cert';
        const targetId = parts[2] || 'agua';

        STATE.returnToModelId = fromModelId;
        STATE.modelDetailOpen = false;
        const prog = getProgress();
        if (targetType === 'collab') {
          STATE.learnTab = 'collab';
          STATE.collabTab = targetId;
          prog.exploredCollabs = true;
        } else {
          STATE.learnTab = 'certs';
          STATE.certTest = targetId;
          STATE.certAnimRunning = false;
          prog.exploredCerts = true;
        }
        saveProgress(prog);
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      if (action === 'return-to-model') {
        const backId = STATE.returnToModelId || STATE.selectedModelId || 'findx10';
        STATE.returnToModelId = '';
        STATE.learnTab = 'models';
        STATE.selectedModelId = backId;
        STATE.modelDetailOpen = true;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      if (action === 'select-series') {
        STATE.selectedSeries = param || 'OVERVIEW';
        STATE.modelDetailOpen = false;
        render();
        return;
      }

      if (action === 'clear-model-search') {
        STATE.modelSearchQuery = '';
        render();
        return;
      }

      if (action === 'open-model') {
        STATE.selectedModelId = param;
        STATE.modelDetailOpen = true;
        const m = OPPO_MODELS.find(x => x.id === param);
        if (m) {
          const prog = getProgress();
          prog.lastActivity = {
            label: `Continuar con ${m.name}`,
            action: 'continue-learning',
            param: m.id
          };
          saveProgress(prog);
        }
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      if (action === 'close-model') {
        STATE.modelDetailOpen = false;
        render();
        return;
      }

      if (action === 'train-this-model') {
        STATE.trainFilterModel = param;
        STATE.trainFilterType = 'ALL';
        const qs = QUESTIONS.filter(q => q.modelId === param);
        const m = OPPO_MODELS.find(x => x.id === param);
        startQuizSession(qs, false, `Practicar ${m ? m.name : 'modelo OPPO'}`);
        return;
      }

      if (action === 'vs-mode') {
        STATE.vsMode = param;
        render();
        return;
      }

      if (action === 'vs-brand') {
        STATE.vsRivalBrand = param;
        const list = param === 'ALL' ? COMPETITORS : COMPETITORS.filter(c => c.brand === param);
        if (list.length > 0) STATE.vsRivalId = list[0].id;
        render();
        return;
      }

      if (action === 'cert-test') {
        if (certAnimTimeout) { clearTimeout(certAnimTimeout); certAnimTimeout = null; }
        STATE.certTest = param;
        STATE.certAnimRunning = false;
        const prog = getProgress();
        prog.exploredCerts = true;
        saveProgress(prog);
        renderPreservingScroll();
        return;
      }

      if (action === 'run-cert-anim') {
        if (certAnimTimeout) { clearTimeout(certAnimTimeout); certAnimTimeout = null; }
        STATE.certAnimRunning = false;
        renderPreservingScroll();
        requestAnimationFrame(function () {
          STATE.certAnimRunning = true;
          const prog = getProgress();
          prog.exploredCerts = true;
          saveProgress(prog);
          renderPreservingScroll();
          certAnimTimeout = setTimeout(function () {
            STATE.certAnimRunning = false;
            certAnimTimeout = null;
            renderPreservingScroll();
          }, 2600);
        });
        return;
      }

      if (action === 'collab-tab') {
        STATE.collabTab = param;
        const prog = getProgress();
        prog.exploredCollabs = true;
        saveProgress(prog);
        render();
        return;
      }

      if (action === 'toggle-hassel') {
        STATE.hasselActive = !STATE.hasselActive;
        render();
        return;
      }

      if (action === 'toggle-lumo') {
        STATE.lumoLooping = false;
        STATE.lumoActive = !STATE.lumoActive;
        STATE.lumoWipePct = STATE.lumoActive ? 88 : 12;
        render();
        return;
      }

      if (action === 'toggle-lumo-loop') {
        STATE.lumoLooping = !STATE.lumoLooping;
        if (!STATE.lumoLooping) {
          STATE.lumoWipePct = 55;
          STATE.lumoActive = true;
        }
        render();
        return;
      }

      if (action === 'sgs-drop') {
        if (param === 'conv') {
          STATE.sgsConvDropped = false;
          render();
          requestAnimationFrame(function () {
            STATE.sgsConvDropped = true;
            render();
          });
        } else {
          STATE.sgsOppoDropped = false;
          render();
          requestAnimationFrame(function () {
            STATE.sgsOppoDropped = true;
            render();
          });
        }
        return;
      }

      if (action === 'toggle-tuv') {
        STATE.tuvProtected = !STATE.tuvProtected;
        render();
        return;
      }

      if (action === 'open-train-hub') {
        stopChallengeTimer();
        stopVoiceRecognition();
        STATE.route = 'train';
        STATE.trainView = 'hub';
        render();
        return;
      }

      if (action === 'open-train-sub') {
        stopChallengeTimer();
        stopVoiceRecognition();
        STATE.route = 'train';
        STATE.trainView = param;
        if (param === 'client') initClientScenario();
        render();
        return;
      }

      if (action === 'back-train-hub') {
        stopChallengeTimer();
        stopVoiceRecognition();
        STATE.trainView = 'hub';
        render();
        return;
      }

      if (action === 'start-guided') {
        let qs = QUESTIONS.slice();
        if (STATE.trainFilterModel !== 'ALL') {
          qs = qs.filter(q => q.modelId === STATE.trainFilterModel);
        }
        if (STATE.trainFilterType !== 'ALL') {
          qs = qs.filter(q => q.type === STATE.trainFilterType);
        }
        startQuizSession(qs, false, 'Continuar entrenamiento guiado');
        return;
      }

      if (action === 'start-eval') {
        const shuffled = QUESTIONS.slice().sort(() => Math.random() - 0.5).slice(0, 12);
        startQuizSession(shuffled, true, 'Evaluación de dominio (12 preguntas)');
        return;
      }

      if (action === 'start-error-quiz') {
        const prog = getProgress();
        const wrongQs = QUESTIONS.filter(q => (prog.wrongIds || []).includes(q.id));
        startQuizSession(wrongQs, false, 'Repaso de errores');
        return;
      }

      if (action === 'answer-quiz') {
        if (STATE.quizAnswered) return;
        const optIdx = Number(param);
        const cur = STATE.quizQuestions[STATE.quizIndex];
        STATE.quizAnswered = true;
        STATE.quizSelectedOpt = optIdx;

        const prog = getProgress();
        prog.questionStats = prog.questionStats || {};
        prog.wrongIds = prog.wrongIds || [];
        const prev = prog.questionStats[cur.id] || { correct: 0, wrong: 0 };

        if (optIdx === cur.ans) {
          STATE.quizHits++;
          prev.correct++;
          prog.wrongIds = prog.wrongIds.filter(id => id !== cur.id);
        } else {
          STATE.quizMisses++;
          prev.wrong++;
          if (!prog.wrongIds.includes(cur.id)) prog.wrongIds.push(cur.id);
        }
        prog.questionStats[cur.id] = prev;
        saveProgress(prog);
        render();
        return;
      }

      if (action === 'next-quiz') {
        STATE.quizIndex++;
        STATE.quizAnswered = false;
        STATE.quizSelectedOpt = -1;
        if (STATE.quizIndex >= STATE.quizQuestions.length) {
          const xpEarned = STATE.quizHits * (STATE.quizIsEval ? 20 : 12);
          recordActivity(
            STATE.quizIsEval ? `Evaluación de dominio (${STATE.quizHits}/${STATE.quizQuestions.length})` : `Entrenamiento guiado (${STATE.quizHits}/${STATE.quizQuestions.length})`,
            xpEarned,
            { label: 'Continuar entrenando', action: 'open-train-hub', param: 'hub' }
          );
        }
        render();
        return;
      }

      if (action === 'start-challenge') {
        startChallengeSession(param);
        return;
      }

      if (action === 'abort-challenge') {
        stopChallengeTimer();
        STATE.trainView = 'challenges';
        render();
        return;
      }

      if (action === 'answer-challenge') {
        const optIdx = Number(param);
        const pool = STATE.challengePool && STATE.challengePool.length ? STATE.challengePool : QUESTIONS;
        const cur = pool[STATE.challengeIndex % pool.length];
        if (optIdx === cur.ans) {
          STATE.challengeScore++;
        }
        STATE.challengeIndex++;
        render();
        syncScreenPressureEffects();
        return;
      }

      if (action === 'client-mode') {
        STATE.clientMode = param;
        initClientScenario();
        render();
        return;
      }

      if (action === 'reset-client') {
        if (STATE.clientMode === '1v1') STATE.clientScenarioIdx++;
        initClientScenario();
        render();
        return;
      }

      if (action === 'toggle-voice') {
        toggleVoiceDictation();
        return;
      }

      if (action === 'send-client-reply') {
        handleClientReply();
        return;
      }

      if (action === 'select-badge') {
        STATE.selectedBadgeId = param;
        render();
        return;
      }

      if (action === 'select-avatar') {
        const prog = getProgress();
        if (param === 'custom_photo') {
          if (!prog.customPhotoData) {
            STATE.profileError = 'Primero selecciona una foto de tu dispositivo.';
            STATE.profileNotice = '';
            render();
            return;
          }
          prog.avatarChoice = 'custom_photo';
          saveProgress(prog);
          STATE.profileError = '';
          STATE.profileNotice = 'Foto personal activada como avatar de perfil.';
          render();
          return;
        }

        const av = PROFILE_AVATARS.find(a => a.id === param);
        if (!av) return;
        if (!av.isUnlocked(prog)) {
          STATE.profileError = `Avatar bloqueado: ${av.reqText}`;
          STATE.profileNotice = '';
          render();
          return;
        }
        prog.avatarChoice = av.id;
        saveProgress(prog);
        STATE.profileError = '';
        STATE.profileNotice = `Avatar "${av.name}" seleccionado.`;
        render();
        return;
      }

      if (action === 'save-profile-name') {
        const newName = ((document.getElementById('prof-edit-name') || {}).value || '').trim();
        if (newName.length < 2) {
          STATE.profileError = 'Ingresa un nombre válido de al menos 2 caracteres.';
          STATE.profileNotice = '';
          render();
          return;
        }
        STATE.currentUser.name = newName;
        if (!STATE.currentUser.isGuest) {
          const users = loadUsersMap();
          if (users[STATE.currentUser.email]) {
            users[STATE.currentUser.email].name = newName;
            saveUsersMap(users);
          }
          try { localStorage.setItem(STORAGE_SESSION_KEY, JSON.stringify(STATE.currentUser)); } catch (err) {}
        }
        STATE.profileError = '';
        STATE.profileNotice = 'Nombre de perfil actualizado.';
        render();
        return;
      }

      if (action === 'toggle-prof-pass') {
        if (param === 'cur') STATE.showCurPass = !STATE.showCurPass;
        else if (param === 'new') STATE.showNewPass = !STATE.showNewPass;
        else STATE.showConfNewPass = !STATE.showConfNewPass;
        render();
        return;
      }

      if (action === 'change-profile-password') {
        if (STATE.currentUser.isGuest) return;
        const curPass = ((document.getElementById('prof-cur-pass') || {}).value || '').trim();
        const newPass = ((document.getElementById('prof-new-pass') || {}).value || '').trim();
        const confPass = ((document.getElementById('prof-conf-pass') || {}).value || '').trim();

        const users = loadUsersMap();
        const acct = users[STATE.currentUser.email];
        if (!acct) {
          STATE.profileError = 'No se encontró la cuenta activa.';
          STATE.profileNotice = '';
          render();
          return;
        }
        if (acct.password !== curPass) {
          STATE.profileError = 'La contraseña actual es incorrecta.';
          STATE.profileNotice = '';
          render();
          return;
        }
        if (newPass.length < 4) {
          STATE.profileError = 'La nueva contraseña debe tener al menos 4 caracteres.';
          STATE.profileNotice = '';
          render();
          return;
        }
        if (newPass !== confPass) {
          STATE.profileError = 'La nueva contraseña y su confirmación no coinciden.';
          STATE.profileNotice = '';
          render();
          return;
        }
        acct.password = newPass;
        saveUsersMap(users);
        STATE.profileError = '';
        STATE.profileNotice = 'Contraseña actualizada correctamente.';
        render();
        return;
      }

      if (action === 'open-ai-modal') {
        STATE.aiModalOpen = true;
        render();
        return;
      }

      if (action === 'close-ai-modal') {
        STATE.aiModalOpen = false;
        render();
        return;
      }

      if (action === 'send-ai-query') {
        const inp = document.getElementById('ai-query-input');
        const q = (inp ? inp.value : '').trim();
        if (!q) return;
        STATE.aiMessages.push({ role: 'user', tag: 'Tú', text: q });
        STATE.aiMessages.push({ role: 'client', tag: 'Asistente Técnico OPPO', text: generateAiTechnicalAnswer(q) });
        render();
        const box = document.getElementById('ai-chat-box');
        if (box) box.scrollTop = box.scrollHeight;
        return;
      }
    });

    document.addEventListener('change', function (e) {
      const sel = e.target.getAttribute('data-select');
      if (!sel) return;
      const val = e.target.value;

      if (sel === 'vs-oppo-rival') {
        STATE.vsRivalOppoId = val;
        render();
      } else if (sel === 'vs-rival') {
        STATE.vsRivalId = val;
        render();
      } else if (sel === 'vs-oppo-a') {
        STATE.vsOppoA = val;
        render();
      } else if (sel === 'vs-oppo-b') {
        STATE.vsOppoB = val;
        render();
      } else if (sel === 'train-model') {
        STATE.trainFilterModel = val;
      } else if (sel === 'train-type') {
        STATE.trainFilterType = val;
      } else if (sel === 'client-oppo') {
        STATE.clientSelectedOppo = val;
        initClientScenario();
        render();
      }
    });

    document.addEventListener('input', function (e) {
      const inpType = e.target.getAttribute('data-input');
      if (inpType === 'client-draft') {
        STATE.clientDraftText = e.target.value;
        return;
      }
      if (inpType === 'model-search') {
        STATE.modelSearchQuery = e.target.value;
        STATE.modelDetailOpen = false;
        render();
        const searchEl = document.getElementById('model-search-input');
        if (searchEl) {
          searchEl.focus();
          const len = searchEl.value.length;
          searchEl.setSelectionRange(len, len);
        }
        return;
      }

      const authField = e.target.getAttribute('data-auth-field');
      if (authField) {
        STATE.authFormDraft[authField] = e.target.value;

        if (STATE.authMode === 'register' && (authField === 'pass1' || authField === 'pass2')) {
          const hintEl = document.getElementById('auth-pass-match-status');
          const p1 = STATE.authFormDraft.pass1 || '';
          const p2 = STATE.authFormDraft.pass2 || '';
          if (hintEl) {
            if (!p1.length || !p2.length) {
              hintEl.style.display = 'none';
            } else {
              const ok = p1 === p2;
              hintEl.style.display = 'flex';
              hintEl.className = 'pass-match-hint ' + (ok ? 'ok' : 'bad');
              hintEl.textContent = ok ? '✓ Las contraseñas coinciden' : '✕ Las contraseñas no coinciden';
            }
          }
        }

        if (STATE.authMode === 'recover' && STATE.recoverStep === 'reset' && (authField === 'pass1' || authField === 'pass2')) {
          const recHintEl = document.getElementById('rec-pass-match-status');
          const p1 = STATE.authFormDraft.pass1 || '';
          const p2 = STATE.authFormDraft.pass2 || '';
          if (recHintEl) {
            if (!p1.length || !p2.length) {
              recHintEl.style.display = 'none';
            } else {
              const ok = p1 === p2;
              recHintEl.style.display = 'flex';
              recHintEl.className = 'pass-match-hint ' + (ok ? 'ok' : 'bad');
              recHintEl.textContent = ok ? '✓ Las contraseñas coinciden' : '✕ Las contraseñas no coinciden';
            }
          }
        }
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target && e.target.id === 'ai-query-input') {
        e.preventDefault();
        const btn = document.querySelector('[data-action="send-ai-query"]');
        if (btn) btn.click();
      }
    });

    /* =========================================================================
       16. INITIALIZATION & GUARANTEED IMMEDIATE RENDER (NO WHITE SCREEN)
       ========================================================================= */
    function initApp() {
      applyTheme();
      try {
        const savedSession = JSON.parse(localStorage.getItem(STORAGE_SESSION_KEY) || 'null');
        if (savedSession && savedSession.email && !savedSession.isGuest) {
          const users = loadUsersMap();
          if (users[savedSession.email]) {
            STATE.currentUser = {
              name: users[savedSession.email].name,
              email: savedSession.email,
              isGuest: false
            };
          }
        }
      } catch (e) {}
      render();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
